[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-signal"
version = "0.1.0"
description = "Local few-shot learning for personal percussive signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshan Krithick" }]
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools]
packages = ["knock"]
