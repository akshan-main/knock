[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "era-manners"
version = "0.1.0"
description = "Attention arbitration and non-intrusive routing for intelligent objects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshan Krithick" }]
dependencies = []

[project.scripts]
manners-demo = "manners.demo:main"

[tool.setuptools]
packages = ["manners"]
